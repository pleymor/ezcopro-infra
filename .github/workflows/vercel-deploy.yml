name: Vercel Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to deploy from ezcopro repo'
        required: false
        default: 'main'
  repository_dispatch:
    types: [deploy-pwa]

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERCEL_ORG_ID: team_NwcLM1S0gRKk7W2rdroiZZTW
  VERCEL_PROJECT_ID: prj_WemEXFHOhDJQmE1CelUisBuFfBX0

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout ezcopro app
        uses: actions/checkout@v4
        with:
          repository: pleymor/ezcopro
          ref: ${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --token "$VERCEL_TOKEN"

      - name: Build Project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Post Deployment Status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = '${{ steps.deploy.outcome }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const url = '${{ steps.deploy.outputs.url }}';

            const body = `## Vercel Deploy - ${emoji} ${status}

            **Ref**: \`${{ github.event.inputs.ref || github.event.client_payload.ref || 'main' }}\`
            **Environment**: production
            **URL**: ${url || 'N/A'}
            **Triggered by**: @${{ github.actor }}

            ---
            *[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

      - name: Fail on Error
        if: steps.deploy.outcome == 'failure'
        run: exit 1
